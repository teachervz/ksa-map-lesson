<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ورقة الروبوت — ٤ نسخ في ورقة A4</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #d9d7e6; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.a4 { width: 210mm; height: 297mm; margin: 0 auto; background: #fff; display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: 148.5mm 148.5mm; position: relative; }
.cell { width: 105mm; height: 148.5mm; overflow: hidden; position: relative; }
.cell iframe { width: 210mm; height: 297mm; border: 0; transform: scale(.5); transform-origin: top right; position: absolute; top: 0; right: 0; }
/* خطوط القص */
.a4::before, .a4::after { content: ""; position: absolute; z-index: 2; pointer-events: none; }
.a4::before { left: 105mm; top: 0; bottom: 0; border-left: .3mm dashed #fff; }
.a4::after { top: 148.5mm; left: 0; right: 0; border-top: .3mm dashed #fff; }
@media print { body { background: #fff; } }
</style>
</head>
<body>
<main class="a4">
  <div class="cell"><iframe src="sheet.html#bare" title="ورقة الروبوت ١"></iframe></div>
  <div class="cell"><iframe src="sheet.html#bare" title="ورقة الروبوت ٢"></iframe></div>
  <div class="cell"><iframe src="sheet.html#bare" title="ورقة الروبوت ٣"></iframe></div>
  <div class="cell"><iframe src="sheet.html#bare" title="ورقة الروبوت ٤"></iframe></div>
</main>
</body>
</html>
