<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التأسيس">
<title>التأسيس — الملك عبدالعزيز</title>

<!--
╔══════════════════════════════════════════════════════════════════════╗
║  عرض تفاعلي — الدراسات الاجتماعية — الوحدة الخامسة                  ║
║  الدرس التاسع والعشرون: المملكة العربية السعودية: التأسيس           ║
║                                                                      ║
║   • Space أو → = التالي | ← = السابق | حرف (ت) = تصفيق 👏             ║
║   • الصور داخل مجلد images بجانب هذا الملف.                          ║
║  🎙️ الصوت (داخل مجلد audio أو بجانب الملف، mp3 أو m4a):              ║
║     robot-1  robot-2  robot-3   ← صوت الروبوت (الشريحة ٤)            ║
║     anthem                       ← النشيد الوطني                    ║
║   إن لم توجد ملفات الروبوت يقرأ النص بصوت المتصفح تلقائيًا.           ║
╚══════════════════════════════════════════════════════════════════════╝
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   1) الهوية البصرية: أخضر وطني + رملي ذهبي + أزرق البحار
   ===================================================================== */
:root{
  --p900:#0b3d26; --p800:#0f5132; --p700:#13704a; --p600:#1b8a5a; --p500:#3aa676;
  --p300:#9fd3b6; --p200:#cfe9da; --p100:#eef7f1;
  --y500:#d4a62a; --y300:#f1d98a; --y200:#f7ead0; --y100:#fdf8ec;
  --frame:#efe2c4;
  --ink:#1d2b23;
  --sea:#bfe0ea; --sea2:#7fbfd3; --land:#f3e9d3; --ksa:#1b8a5a;
  --ok:#1f8f57;  --okbg:#e2f6ea;
  --bad:#c8443a; --badbg:#fdeceb;
  --root:#b5452c;
  --f-text:'Noto Naskh Arabic','Traditional Arabic','Geeza Pro','Times New Roman',serif;
  --f-ui:'Tajawal','Segoe UI','Geeza Pro',Tahoma,sans-serif;
  --f-head:'Tajawal','Geeza Pro',sans-serif;
  --shadow:0 12px 30px rgba(15,81,50,.13);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--frame)}
body{font-family:var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;
     user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
mark{background:var(--y300);color:inherit;border-radius:10px;padding:0 8px}

/* =====================================================================
   2) المسرح 16:9 (1920×1080)
   ===================================================================== */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:radial-gradient(ellipse at 20% 0%, #f7eed8, transparent 60%), var(--frame)}
#wave{position:absolute;inset:0;width:100%;height:100%}
#paper{position:absolute;left:82px;right:82px;top:66px;bottom:66px;border-radius:38px;
  border:7px solid #fff;box-shadow:0 18px 40px rgba(110,80,20,.18);
  background-color:#fffcf3;
  background-image:
    radial-gradient(ellipse at center, transparent 55%, rgba(212,166,42,.10) 100%),
    linear-gradient(rgba(27,138,90,.075) 2px, transparent 2px),
    linear-gradient(90deg, rgba(27,138,90,.075) 2px, transparent 2px);
  background-size:100% 100%, 120px 120px, 120px 120px}
#paper::after{content:'';position:absolute;inset:10px;border:3px dashed rgba(212,166,42,.45);border-radius:30px;pointer-events:none}
#slides{position:absolute;left:89px;right:89px;top:73px;bottom:73px;border-radius:32px;overflow:hidden}

.deco{position:absolute;pointer-events:none;z-index:5}
.deco-compass{top:14px;left:30px;width:136px;animation:spin 40s linear infinite}
.deco-palm{bottom:6px;right:22px;width:150px}
@keyframes spin{to{transform:rotate(360deg)}}

/* شريط الرحلة (التقدم) */
#progress{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:700px;height:14px;z-index:6;
  background:repeating-linear-gradient(90deg, rgba(15,81,50,.25) 0 14px, transparent 14px 24px);border-radius:99px}
#progress i{position:absolute;right:0;top:0;height:100%;width:0;border-radius:99px;
  background:linear-gradient(270deg,var(--p600),var(--y500));transition:width .6s ease}
#progress b{position:absolute;top:50%;right:0;transform:translate(50%,-50%);font-size:34px;line-height:1;transition:right .6s ease;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}

#counter{position:absolute;left:110px;bottom:18px;z-index:20;font:800 30px var(--f-ui);
  color:var(--p800);background:#fff;padding:8px 26px;border-radius:99px;box-shadow:0 6px 0 var(--p300)}

/* =====================================================================
   3) شريط التحكم
   ===================================================================== */
#controls{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:12px;direction:ltr;
  background:rgba(11,61,38,.93);padding:10px 14px;border-radius:99px;
  box-shadow:0 14px 34px rgba(11,61,38,.35);transition:opacity .45s ease, transform .45s ease}
#controls button{border:0;border-radius:99px;font:800 30px var(--f-ui);color:#fff;background:rgba(255,255,255,.12);
  padding:12px 30px;transition:transform .15s, background .2s;direction:rtl}
#controls button:hover{background:rgba(255,255,255,.25);transform:translateY(-2px)}
#controls button:active{transform:scale(.93)}
#controls #cNum{background:transparent;cursor:default;min-width:150px;font-weight:900;direction:ltr}
#controls #cClap{background:var(--y500);color:var(--p900);font-size:40px;padding:6px 26px}
#controls #cClap.pulse{animation:clapPulse .5s ease}
#controls #cFull{font-size:30px;padding:12px 22px}
#hint{position:absolute;right:190px;bottom:22px;z-index:30;font:700 22px var(--f-ui);color:var(--p800);
  background:rgba(255,255,255,.9);padding:10px 22px;border-radius:99px;transition:opacity .45s ease}
#hint span{unicode-bidi:isolate;white-space:nowrap}
#hint b{font-weight:900}
body.idle #controls{opacity:0;transform:translate(-50%,40px);pointer-events:none}
body.idle #hint{opacity:0}
@media (hover:none){#hint{display:none}}
body.idle{cursor:none}

/* =====================================================================
   4) الشرائح والانتقالات
   ===================================================================== */
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:38px 64px 104px;
  visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.slide.leaving{visibility:visible;animation:outFade .38s ease forwards;z-index:1}
.slide.active.a-fade{animation:inFade .7s ease both}
.slide.active.a-zoom{animation:inZoom .75s cubic-bezier(.2,.8,.2,1) both}
.slide.active.a-slide.d-next{animation:inFromLeft .7s cubic-bezier(.2,.8,.2,1) both}
.slide.active.a-slide.d-prev{animation:inFromRight .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes outFade{to{opacity:0}}
@keyframes inZoom{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@keyframes inFromLeft{from{opacity:0;transform:translateX(-140px)}to{opacity:1;transform:none}}
@keyframes inFromRight{from{opacity:0;transform:translateX(140px)}to{opacity:1;transform:none}}
.slide.active .rv{animation:rvIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.18s + var(--i,0) * .1s)}
@keyframes rvIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes clapPulse{50%{transform:scale(1.25) rotate(-8deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(212,166,42,0)}50%{box-shadow:0 0 0 12px rgba(212,166,42,.45)}}
.pop{animation:popIn .5s cubic-bezier(.3,1.4,.5,1) both}
.shake{animation:shake .45s ease}

/* =====================================================================
   5) عناصر مشتركة
   ===================================================================== */
.s-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:20px;min-height:104px}
.s-title{margin:0;font:900 58px/1.5 var(--f-head);color:var(--p800);padding:0 14px;
  background:linear-gradient(transparent 62%, var(--y300) 62%, var(--y300) 90%, transparent 90%)}
.head-tools{display:flex;align-items:center;gap:16px}
.badge{font:800 30px var(--f-ui);color:#fff;background:var(--p600);padding:12px 28px;border-radius:99px;
  box-shadow:0 6px 0 var(--p800);white-space:nowrap}
.badge.gold{background:var(--y500);color:var(--p900);box-shadow:0 6px 0 #a8821c}
.badge.red{background:var(--root);box-shadow:0 6px 0 #7d2d1b}
.icon-btn{border:3px solid var(--p300);background:#fff;color:var(--p700);width:62px;height:62px;border-radius:50%;
  font:900 30px var(--f-ui);display:inline-grid;place-items:center;transition:transform .15s, background .2s;flex:none}
.icon-btn:hover{background:var(--p100);transform:rotate(-20deg)}
.icon-btn:active{transform:scale(.9)}
.reset{opacity:.55}.reset:hover{opacity:1}

.card{background:rgba(255,255,255,.96);border-radius:34px;box-shadow:var(--shadow);border:3px solid var(--p200)}
.intro{margin:0 0 16px;text-align:center;font:700 38px/1.6 var(--f-text);color:var(--p700)}

.btn{border:0;border-radius:99px;background:var(--p700);color:#fff;font:800 34px var(--f-ui);padding:16px 40px;
  box-shadow:0 7px 0 var(--p900);transition:transform .15s, box-shadow .15s, background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-3px);background:var(--p600)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--p900)}
.btn.soft{background:#fff;color:var(--p700);box-shadow:0 7px 0 var(--p300);border:3px solid var(--p300)}
.btn.soft:hover{background:var(--p100)}
.btn.yellow{background:var(--y500);color:var(--p900);box-shadow:0 7px 0 #a8821c}
.btn.big{font-size:46px;padding:22px 64px}
.btn.sm{font-size:28px;padding:10px 26px}
.btn-row{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap}
.msg{font:800 42px var(--f-ui);padding:12px 40px;border-radius:99px;display:inline-block}
.msg.ok{background:var(--okbg);color:var(--ok);border:3px solid #9bd9b8}
.msg.bad{background:var(--badbg);color:var(--bad);border:3px solid #f2b6b0}
.feedback{min-height:84px;display:flex;justify-content:center;align-items:center;text-align:center}

/* المؤقت */
.timer{display:flex;align-items:center;gap:14px;justify-content:center}
.t-ring{position:relative;width:140px;height:140px}
.t-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.t-track{fill:#fff;stroke:var(--p200);stroke-width:12}
.t-bar{fill:none;stroke:var(--p600);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s linear, stroke .3s}
.t-num{position:absolute;inset:0;display:grid;place-items:center;font:900 38px var(--f-ui);color:var(--p800);direction:ltr}
.t-btns{display:flex;flex-direction:column;gap:10px}
.timer.low .t-bar{stroke:var(--bad)} .timer.low .t-num{color:var(--bad)}
.timer.done .t-ring{animation:shake .5s ease 2}
.timer.mini .t-ring{width:96px;height:96px}.timer.mini .t-num{font-size:28px}
.timer.mini .t-btns{flex-direction:row}.timer.mini .icon-btn{width:52px;height:52px;font-size:24px}

/* =====================================================================
   6) الخرائط (SVG)
   ===================================================================== */
.map{position:relative;border-radius:30px;overflow:hidden;background:var(--sea);border:5px solid #fff;
  box-shadow:0 0 0 3px var(--p200), var(--shadow)}
.map svg{display:block;width:100%;height:100%}
.map .seaR{fill:url(#seaGrad)}
.map .c{fill:var(--land);stroke:#fff;stroke-width:1.6;transition:fill .4s}
.map .c.ksa{fill:var(--ksa);stroke:#fff;stroke-width:2.4}
.map .c.hi{fill:var(--y500);animation:hiPulse 1.6s ease-in-out infinite}
.map .c.done{fill:#f1d98a}
.map .c.click{cursor:pointer}
.map .c.click:hover{fill:#ead9ad}
.map .c.ksa.click:hover{fill:#23a36b}
@keyframes hiPulse{50%{fill:#f1d98a}}
.map text{font-family:var(--f-ui);font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;fill:#5c5040;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.map text.ksaL{fill:#fff;stroke:var(--p800);stroke-width:7px;font-size:40px}
.map text.nb{font-size:30px;fill:#6b5a3a}
.map text.ctx{font-size:24px;fill:#a2967e;font-weight:700}
.map text.wt{font-size:30px;fill:#1d6f8c;font-style:normal;font-weight:800;stroke:#e3f2f7}
.map text.lbl-hi{fill:var(--p900);font-size:34px}
.map .lbls text{transition:opacity .4s}
.map.hide-lbl .lbls text.nb, .map.hide-lbl .lbls text.wt{opacity:0}
.map .lbls text.show{opacity:1 !important;animation:lblPop .5s ease both}
@keyframes lblPop{from{opacity:0}to{opacity:1}}
.map .pin{cursor:pointer}
.map .pin-in{transform-box:fill-box;transform-origin:center}
.map .pin .pr{fill:none;stroke:var(--root);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ripple 1.8s ease-out infinite}
@keyframes ripple{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}
.map .q{cursor:pointer}
.map .q circle{fill:#fff;stroke:var(--y500);stroke-width:5}
.map .q text{fill:var(--root);font-size:34px;stroke:none;font-weight:900}
.map .q .ring{fill:none;stroke:var(--y500);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ripple 2s ease-out infinite}
.map .q.open circle{fill:var(--ok);stroke:#fff}
.map .q.open text{fill:#fff}
.map .q.open .ring{display:none}
.map .arrow{stroke:var(--root);stroke-width:7;fill:none;stroke-linecap:round;stroke-dasharray:14 12;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.map .ah{fill:var(--root)}
.map .compass-mini text{font-size:28px;fill:var(--p800);stroke-width:5}
.map .tap-mark{fill:var(--bad);opacity:.85}

/* =====================================================================
   7) أنماط الشرائح
   ===================================================================== */

/* — الغلاف — */
.cover{flex:1;display:flex;align-items:center;gap:40px}
.cv-text{flex:1.15;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.cover-pill{font:800 32px var(--f-ui);color:var(--p700);background:var(--p100);border:3px solid var(--p300);padding:10px 34px;border-radius:99px}
.cover-greet{margin:0;font:700 44px/1.7 var(--f-text);color:var(--p600)}
.cover-kicker{font:800 44px var(--f-head);color:#fff;background:var(--p700);padding:6px 46px;border-radius:24px 24px 24px 0;box-shadow:0 7px 0 var(--p900)}
.cover-title{margin:0;font:900 134px/1.3 var(--f-head);white-space:nowrap;color:var(--p800);text-shadow:7px 7px 0 var(--y300)}
.cover-sub{margin:0;font:700 46px/1.6 var(--f-text);color:var(--p700);background:#fff;padding:4px 44px;border-radius:99px;box-shadow:var(--shadow)}
.cover-meta{font:700 27px var(--f-ui);color:var(--p500);margin-top:6px}
.cv-map{flex:1;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.cv-map svg{width:100%;max-height:760px;overflow:visible}
.cv-ksa{fill:rgba(27,138,90,.12);stroke:var(--p700);stroke-width:5;stroke-linejoin:round;
  stroke-dasharray:4000;stroke-dashoffset:4000}
.slide.active .cv-ksa{animation:draw 3.2s .4s ease forwards, fillIn 1.2s 3.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill:rgba(27,138,90,.9)}}
.cv-pin{opacity:0;transform-box:fill-box;transform-origin:center}
.slide.active .cv-pin{animation:popIn .5s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:calc(3.6s + var(--d) * .25s)}
.cv-pin text{font:800 30px var(--f-ui);fill:#fff;paint-order:stroke;stroke:var(--p900);stroke-width:6px;text-anchor:middle}
.floaty{position:absolute;font-size:70px;opacity:.9;animation:bob 5s ease-in-out infinite;pointer-events:none}

/* — النشيد الوطني — */
.anthem{flex:1;display:flex;gap:44px;min-height:0;align-items:stretch}
.an-side{width:470px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.an-ico{font-size:130px;animation:bob 4s ease-in-out infinite}
.an-note{font:700 36px/1.7 var(--f-text);color:var(--p800)}
.an-card{flex:1;position:relative;padding:24px 60px;display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:center;
  background:linear-gradient(160deg,#fff,#f4fbf6);border:4px solid var(--p300);overflow:hidden}
.an-card::before{content:'';position:absolute;inset:14px;border:3px solid var(--y300);border-radius:24px;pointer-events:none}
.an-line{font:700 42px/1.62 var(--f-text);color:var(--p900);border-radius:20px;padding:0 20px;cursor:pointer;transition:background .3s, color .3s, transform .3s}
.an-line:hover{background:var(--p100)}
.an-line.on{background:var(--p700);color:#fff;transform:scale(1.04)}
.an-line.big{font-size:48px;color:var(--p700)}
.eq{display:flex;gap:6px;height:46px;align-items:flex-end}
.eq i{width:10px;background:var(--p600);border-radius:6px;height:20%}
.eq.on i{animation:eqb .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eqb{from{height:15%}to{height:100%}}

/* — صح أم خطأ (التشخيصي) — */
.tf-list{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center}
.tf-row{display:flex;align-items:center;gap:24px;padding:14px 30px;transition:border-color .3s, background .3s}
.tf-row.solved{border-color:var(--ok);background:#f6fcf8}
.tf-n{width:62px;height:62px;flex:none;border-radius:50%;background:var(--y300);display:grid;place-items:center;font:900 32px var(--f-ui);color:var(--p800)}
.tf-main{flex:1}
.tf-txt{font:700 44px/1.6 var(--f-text)}
.tf-exp{font:700 30px var(--f-ui);color:var(--p600);display:none;margin-top:4px}
.tf-row.solved .tf-exp{display:block;animation:popIn .45s both}
.tf-btn{border:3px solid;border-radius:22px;font:800 34px var(--f-ui);padding:12px 30px;transition:transform .15s}
.tf-btn:hover{transform:translateY(-3px)}
.tf-btn.yes{background:var(--okbg);color:var(--ok);border-color:#9bd9b8}
.tf-btn.no{background:var(--badbg);color:var(--bad);border-color:#f2b6b0}
.tf-btn.picked{outline:5px solid var(--y500)}
.tf-score{text-align:center;min-height:70px}

/* — الروبوت والواقع المعزز — */
.ar{flex:1;min-height:0;position:relative;border-radius:36px;overflow:hidden;
  background:radial-gradient(ellipse at 30% 40%, #11523a 0%, #072a1d 70%);box-shadow:0 18px 40px rgba(7,42,29,.4);border:5px solid #0f5132}
.ar video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.ar.cam video{opacity:1}
.ar-floor{position:absolute;left:-30%;right:-30%;bottom:-10%;height:62%;transform:perspective(600px) rotateX(62deg);transform-origin:bottom;
  background-image:linear-gradient(rgba(111,245,192,.35) 2px, transparent 2px), linear-gradient(90deg, rgba(111,245,192,.35) 2px, transparent 2px);
  background-size:70px 70px;animation:floorMove 3s linear infinite;
  -webkit-mask-image:linear-gradient(to top, #000 30%, transparent);mask-image:linear-gradient(to top, #000 30%, transparent)}
@keyframes floorMove{to{background-position:0 70px}}
.ar.cam .ar-floor{opacity:.35}
.ar-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px)}
.ar-sweep{position:absolute;left:0;right:0;height:140px;top:-140px;pointer-events:none;
  background:linear-gradient(to bottom, transparent, rgba(111,245,192,.25), transparent);animation:sweep 4.5s linear infinite}
@keyframes sweep{to{top:100%}}
.ar-corner{position:absolute;width:70px;height:70px;border:6px solid #6ff5c0;pointer-events:none;filter:drop-shadow(0 0 6px #6ff5c0)}
.ar-corner.tl{top:22px;left:22px;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.ar-corner.tr{top:22px;right:22px;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.ar-corner.bl{bottom:22px;left:22px;border-right:0;border-top:0;border-radius:0 0 0 18px}
.ar-corner.br{bottom:22px;right:22px;border-left:0;border-top:0;border-radius:0 0 18px 0}
.ar-tag{position:absolute;top:30px;left:110px;font:800 24px var(--f-ui);color:#072a1d;background:#6ff5c0;padding:6px 18px;border-radius:99px;direction:ltr;
  display:flex;align-items:center;gap:8px}
.ar-tag::before{content:'';width:12px;height:12px;border-radius:50%;background:#e8403a;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ar-coord{position:absolute;bottom:34px;left:110px;font:700 22px/1.5 ui-monospace,Menlo,monospace;color:#6ff5c0;direction:ltr;text-shadow:0 0 6px #072a1d}
.rb-wrap{position:absolute;left:150px;top:30px;width:420px;height:560px;cursor:grab;touch-action:none;z-index:3}
.rb-wrap:active{cursor:grabbing}
.slide.active .rb-wrap{animation:materialize 1.6s .35s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes materialize{
  0%{opacity:0;transform:scaleY(.05) scaleX(.6);filter:brightness(4) blur(10px) hue-rotate(60deg)}
  40%{opacity:1;transform:scaleY(1.08) scaleX(.95);filter:brightness(2) blur(3px)}
  55%{transform:translateX(-8px) skewX(6deg)} 62%{transform:translateX(6px) skewX(-4deg)}
  100%{opacity:1;transform:none;filter:none}}
.rb-beam{position:absolute;left:30px;right:30px;bottom:-10px;height:640px;pointer-events:none;opacity:0;
  background:linear-gradient(to top, rgba(111,245,192,.75), rgba(111,245,192,0));clip-path:polygon(25% 100%, 75% 100%, 100% 0, 0 0)}
.slide.active .rb-beam{animation:beam 1.9s .2s ease both}
@keyframes beam{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.rb-rings{position:absolute;left:50%;bottom:6px;width:330px;height:80px;transform:translateX(-50%);pointer-events:none}
.rb-rings i{position:absolute;inset:0;border:4px solid #6ff5c0;border-radius:50%;opacity:.0;animation:ringOut 2.4s ease-out infinite}
.rb-rings i:nth-child(2){animation-delay:.8s}.rb-rings i:nth-child(3){animation-delay:1.6s}
@keyframes ringOut{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.2);opacity:0}}
.robot{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 18px rgba(111,245,192,.45))}
.rb-float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-16px)}}
.rb-shadow{animation:shadowS 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shadowS{50%{transform:scale(.8);opacity:.6}}
.rb-eyes{transform-box:fill-box;transform-origin:center;animation:blinkE 4.2s infinite}
@keyframes blinkE{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.rb-mouth rect{transform-box:fill-box;transform-origin:center;transition:transform .1s}
.talking .rb-mouth rect{animation:talk .28s ease-in-out infinite alternate}
.talking .rb-mouth rect:nth-child(2){animation-delay:.08s}.talking .rb-mouth rect:nth-child(3){animation-delay:.16s}
.talking .rb-mouth rect:nth-child(4){animation-delay:.04s}.talking .rb-mouth rect:nth-child(5){animation-delay:.12s}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(4.2)}}
.rb-wave{transform-box:view-box;transform-origin:118px 300px}
.talking .rb-wave{animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(16deg)}}
.rb-tip{animation:tipGlow 1.4s ease-in-out infinite}
@keyframes tipGlow{50%{fill:#fff6c8}}
.talking .rb-tip{animation-duration:.4s}
.rb-chest-dot{animation:ripple 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.say{position:absolute;right:40px;top:40px;bottom:40px;width:930px;z-index:4;display:flex;flex-direction:column;gap:18px}
.say-box{flex:1;min-height:0;position:relative;background:rgba(255,255,255,.95);border-radius:36px;padding:30px 40px;
  border:4px solid #6ff5c0;box-shadow:0 0 0 8px rgba(111,245,192,.2), 0 18px 34px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.say-box::after{content:'';position:absolute;left:-34px;top:120px;border:20px solid transparent;border-right:20px solid #6ff5c0;border-left:0;width:0;height:0;
  border-top-width:22px;border-bottom-width:22px;transform:scaleX(1.5)}
.say-name{display:flex;align-items:center;gap:14px;font:800 32px var(--f-ui);color:var(--p800)}
.say-name small{font:700 24px var(--f-ui);color:var(--p500)}
.say-txt{flex:1;min-height:0;font:700 44px/1.75 var(--f-text);color:var(--ink);overflow:hidden}
.say-txt .wd{opacity:.18;transition:opacity .25s, color .25s}
.say-txt .wd.on{opacity:1}
.say-txt .wd.now{color:var(--p600)}
.say-txt mark{background:var(--y300)}
.say-ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{width:62px;height:62px;border-radius:50%;border:3px solid var(--p300);background:#fff;font:900 28px var(--f-ui);color:var(--p700)}
.seg.on{background:var(--p700);color:#fff;border-color:var(--p700)}
.seg.done{background:var(--p100)}
.ar-tools{display:flex;gap:14px;justify-content:flex-start}
.ar-tools .btn{font-size:28px;padding:12px 28px}
.ar-tools .btn.cam{background:#072a1d;color:#6ff5c0;box-shadow:0 6px 0 #000;border:3px solid #6ff5c0}

.slide.s-robot{padding:22px 26px 22px}
.ar-full{border-radius:30px}
.ar-full .rb-wrap{left:90px;top:auto;bottom:40px;width:440px;height:590px}
.globe-wrap{position:absolute;right:150px;top:50%;width:780px;height:780px;margin-top:-390px;z-index:2}
.globe{width:100%;height:100%;display:block;cursor:grab;touch-action:none;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}
.globe:active{cursor:grabbing}
.slide.active .globe-wrap{animation:globeIn 1.4s .9s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes globeIn{from{opacity:0;transform:scale(.2) rotate(-40deg);filter:brightness(3)}to{opacity:1;transform:none}}
.globe-hand{position:absolute;left:50%;top:62%;font-size:96px;pointer-events:none;animation:swipe 2.2s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
@keyframes swipe{0%,100%{transform:translateX(-120px) rotate(-10deg)}50%{transform:translateX(80px) rotate(10deg)}}
.ar-tools-ico{position:absolute;top:30px;right:110px;display:flex;gap:14px;z-index:5}
.ar-ico{width:76px;height:76px;border-radius:50%;border:3px solid #6ff5c0;background:rgba(7,42,29,.8);font-size:36px;display:grid;place-items:center;
  box-shadow:0 0 14px rgba(111,245,192,.4);transition:transform .15s}
.ar-ico:hover{transform:scale(1.08)} .ar-ico.on{background:#6ff5c0}
.rb-wrap.happy .robot{animation:hop .5s ease 3}
@keyframes hop{50%{transform:translateY(-50px) rotate(-6deg)}}
.rb-wrap.no .robot{animation:headNo .5s ease}
@keyframes headNo{20%,60%{transform:rotate(-6deg)}40%,80%{transform:rotate(6deg)}}
.rb-wrap.happy .rb-eyes ellipse{fill:#f1c84b}

/* — محطات الرحلة (الأهداف) — */
.mission{text-align:center;font:700 42px/1.6 var(--f-text);color:var(--p900);padding:18px 40px;margin-bottom:26px;
  background:var(--y100);border-color:var(--y300)}
.stations{flex:1;display:flex;gap:30px;align-items:stretch;position:relative}
.stations::before{content:'';position:absolute;left:60px;right:60px;top:50%;border-top:8px dashed var(--y300);z-index:0}
.st{flex:1;position:relative;z-index:1;padding:64px 26px 30px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:transform .2s, border-color .3s, background .3s}
.st:hover{transform:translateY(-6px)}
.st-n{position:absolute;top:-34px;left:50%;margin-left:-38px;width:76px;height:76px;border-radius:50%;background:var(--p700);color:#fff;
  font:900 40px var(--f-ui);display:grid;place-items:center;box-shadow:0 6px 0 var(--p900)}
.st-ico{font-size:96px;animation:bob 4.5s ease-in-out infinite}
.st-txt{font:700 42px/1.6 var(--f-text)}
.st.done{border-color:var(--ok);background:var(--okbg)}
.st.done::after{content:'✓ أُنجزت';position:absolute;bottom:16px;left:50%;transform:translateX(-50%) rotate(-6deg);font:900 30px var(--f-ui);color:var(--ok);
  border:4px solid var(--ok);border-radius:14px;padding:0 14px;background:#fff}
.st.final .st-n{background:var(--y500);color:var(--p900);box-shadow:0 6px 0 #a8821c}

/* — تخطيط خريطة + لوحة — */
.mapwrap{flex:1;min-height:0;display:flex;gap:34px}
.mapwrap .map{height:100%;aspect-ratio:var(--ar);flex:none;max-width:62%}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.p-box{padding:22px 32px;font:700 38px/1.7 var(--f-text)}
.p-box.q{background:var(--y100);border-color:var(--y300);color:var(--p900)}
.p-hint{font:700 28px var(--f-ui);color:var(--p500);text-align:center}
.reveal{display:none}
.reveal.show{display:block;animation:popIn .55s both}
.hl{color:#1572a1;font-weight:700}
.cont{position:absolute;font:800 44px var(--f-head);color:var(--p900);background:#fff;border:4px solid var(--y500);border-radius:20px;padding:2px 26px;
  opacity:0;transform:scale(.4);transition:all .6s cubic-bezier(.3,1.4,.5,1);pointer-events:none;white-space:nowrap}
.cont.show{opacity:1;transform:none}

/* — أهمية الموقع: بطاقات مقلوبة — */
.flip-grid{flex:1;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:30px}
.flip{width:calc((100% - (var(--cols) - 1) * 30px) / var(--cols));height:min(calc((100% - (var(--rows) - 1) * 30px) / var(--rows)), 520px);perspective:1600px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:34px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px 30px;text-align:center}
.front{background:#fff;border:4px solid var(--p200);box-shadow:var(--shadow)}
.flip:hover .front{border-color:var(--p500)}
.back{background:linear-gradient(155deg,var(--p600),var(--p800));color:#fff;transform:rotateY(180deg);box-shadow:var(--shadow)}
.f-ico{font-size:120px;line-height:1.1}
.f-txt{font:700 50px/1.55 var(--f-head);color:var(--p800)}
.tap{font:700 26px var(--f-ui);color:var(--p500)}
.b-ico{font-size:72px;line-height:1}
.b-txt{font:700 40px/1.7 var(--f-text)}
.back mark{background:var(--y300);color:var(--p900)}

/* — البوصلة (الدول المجاورة) — */
.compass{position:relative;width:420px;height:420px;margin:0 auto;flex:none}
.compass .ring{position:absolute;inset:60px;border-radius:50%;border:6px solid var(--p200);
  background:radial-gradient(circle,#fff 0 60%, var(--p100) 61%)}
.compass .star{position:absolute;inset:0;margin:auto;width:150px;height:150px}
.dir{position:absolute;width:150px;height:96px;border-radius:28px;border:0;font:800 34px var(--f-ui);color:#fff;background:var(--p700);
  box-shadow:0 7px 0 var(--p900);transition:transform .15s, background .2s}
.dir:hover{transform:translateY(-3px)}
.dir.on{background:var(--y500);color:var(--p900);box-shadow:0 7px 0 #a8821c;animation:glow 1.6s infinite}
.dir.seen:not(.on){background:var(--p500)}
.dir.n{top:0;left:50%;margin-left:-75px}.dir.s{bottom:0;left:50%;margin-left:-75px}
.dir.e{right:0;top:50%;margin-top:-48px}.dir.w{left:0;top:50%;margin-top:-48px}
.nb-out{flex:1;min-height:0;padding:20px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.nb-dir{font:800 40px var(--f-head);color:var(--root)}
.nb-list{display:flex;flex-wrap:wrap;gap:12px}
.nb-chip{font:700 38px var(--f-text);background:var(--y200);border:3px solid var(--y300);border-radius:99px;padding:2px 26px;animation:popIn .45s both}
.nb-chip.water{background:#dff0f6;border-color:var(--sea2);color:#1572a1}
.nb-empty{font:700 34px/1.6 var(--f-text);color:var(--p500);text-align:center}

/* — بطاقات المعلومات (المسطحات) — */
.info-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;justify-content:center}
.info{padding:16px 28px;display:flex;gap:20px;align-items:center;opacity:.45;transition:opacity .4s, border-color .4s}
.info.open{opacity:1;border-color:var(--sea2);background:#f3fafc}
.info .i-ico{font-size:64px}
.info .i-name{font:800 40px var(--f-head);color:#1572a1}
.info .i-txt{font:700 32px/1.6 var(--f-text);display:none}
.info.open .i-txt{display:block;animation:popIn .45s both}
.info .i-q{font:700 30px var(--f-ui);color:var(--p500)}
.info.open .i-q{display:none}

.pl .info-list{gap:12px}
.pl .info{padding:10px 22px;gap:16px}
.pl .info .i-ico{font-size:50px}
.pl .info .i-name{font-size:34px}
.pl .info .i-txt{font-size:27px;line-height:1.55}
.pl .info .i-q{font-size:26px}

/* — نشاط ١ (أكملي) — */
.fill-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;justify-content:center}
.fr-ans.many .blank{min-width:112px;height:52px;font-size:28px;padding:0 12px}
.fill-row{padding:10px 24px}
.a1 .map{max-width:44%}
.a1 .panel{gap:12px}
.fr-txt{font:700 32px/1.55 var(--f-text)}
.fr-ans{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.blank{min-width:220px;height:58px;border:4px dashed var(--p300);border-radius:20px;font:700 32px var(--f-text);
  color:var(--p500);background:var(--p100);transition:transform .15s;padding:0 18px}
.blank:hover{transform:scale(1.04)}
.blank.open{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--okbg);animation:popIn .45s}
.fact{padding:10px 26px;font:700 31px/1.65 var(--f-text);text-align:center;background:var(--p100);border-color:var(--p300);color:var(--p900);cursor:pointer}
.fact b{color:var(--root)}
.fact .fx-h{display:inline-block;background:var(--p300);border-radius:14px;padding:0 14px;color:transparent;transition:all .4s}
.fact.open .fx-h{background:var(--y300);color:var(--root)}

/* — نشاط ٢ (حدّدي الموقع) — */
.loc-list{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
.loc{display:flex;align-items:center;gap:20px;padding:16px 26px;font:700 42px var(--f-text);text-align:start;transition:all .25s}
.loc .l-ico{font-size:56px}
.loc .l-st{margin-inline-start:auto;font:800 28px var(--f-ui);color:var(--p500)}
.loc.on{border-color:var(--y500);background:var(--y100);transform:scale(1.03);box-shadow:0 0 0 6px rgba(212,166,42,.25)}
.loc.ok{border-color:var(--ok);background:var(--okbg)}
.loc.ok .l-st{color:var(--ok)}

/* — السؤال الفردي — */
.single{flex:1;display:flex;gap:36px;min-height:0}
.picker{width:420px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.pk-t{font:800 36px var(--f-ui);color:var(--p800)}
.pk-num{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;font:900 110px var(--f-ui);color:var(--p800);
  background:radial-gradient(circle at 35% 30%, #fff, var(--y200));border:8px solid var(--y500);box-shadow:var(--shadow)}
.pk-num.spin{animation:pulse .12s ease infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
.pk-num.got{border-color:var(--p600);animation:popIn .5s}
.pk-set{display:flex;align-items:center;gap:12px;font:700 26px var(--f-ui);color:var(--p500)}
.sq{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.sq-q{padding:22px 38px;font:700 46px/1.7 var(--f-text);text-align:center}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-content:center}
.opt{display:flex;align-items:center;gap:22px;font:700 46px/1.45 var(--f-text);background:#fff;color:var(--ink);
  border:4px solid var(--p200);border-radius:28px;padding:14px 26px;box-shadow:0 8px 0 var(--p200), var(--shadow);
  transition:transform .15s, border-color .2s, background .2s;text-align:start}
.opt:hover{transform:translateY(-4px);border-color:var(--p500)}
.opt .o-k{font:900 34px var(--f-ui);width:70px;height:70px;flex:none;display:grid;place-items:center;background:var(--p100);border-radius:20px;color:var(--p700)}
.opt.correct{background:var(--okbg);border-color:var(--ok);box-shadow:0 8px 0 #9bd9b8}
.opt.wrong{background:var(--badbg);border-color:var(--bad);opacity:.75;box-shadow:0 8px 0 #f2b6b0}

/* — مهارات التفكير العليا — */
.hots{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:24px}
.hc{padding:22px 30px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hc-tag{align-self:flex-start;font:800 26px var(--f-ui);color:#fff;background:var(--root);border-radius:99px;padding:4px 20px}
.hc-q{font:700 36px/1.6 var(--f-text);color:var(--p900);flex:1}
.hc-a{display:none;font:700 30px/1.6 var(--f-text);color:var(--p800);background:var(--y100);border:3px solid var(--y300);border-radius:20px;padding:10px 20px}
.hc.open .hc-a{display:block;animation:popIn .5s both}
.hc.open .hc-btn{display:none}
.hc-btn{align-self:flex-end}

/* — المادة ٣٤ — */
.art{flex:1;display:flex;gap:40px;min-height:0}
.doc{flex:1.15;position:relative;padding:0;overflow:hidden;display:flex;flex-direction:column;background:#fffdf6;border:4px solid var(--y300)}
.doc-h{background:var(--p800);color:#fff;padding:22px 40px;display:flex;align-items:center;gap:22px}
.doc-h .seal{width:96px;height:96px;flex:none}
.doc-h b{display:block;font:700 44px var(--f-head)}
.doc-h small{font:700 28px var(--f-ui);color:var(--y300)}
.doc-b{flex:1;padding:34px 50px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.doc-num{align-self:center;font:800 40px var(--f-head);color:var(--root);border-bottom:5px double var(--y500);padding:0 24px 6px}
.doc-txt{font:700 50px/1.95 var(--f-text);text-align:center;color:var(--p900)}
.doc-txt .k{cursor:pointer;border-radius:12px;padding:0 6px;transition:background .3s}
.doc-txt .k.on{background:var(--y300)}
.art-side{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.ideas{display:flex;flex-direction:column;gap:12px}
.idea{font:700 34px/1.5 var(--f-text);background:#fff;border:3px solid var(--p200);border-radius:22px;padding:8px 22px;animation:popIn .45s both}

/* — تحدي الدقيقة — */
.ch{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:30px}
.ch-ico{font-size:120px;animation:bob 3s ease-in-out infinite}
.ch-desc{margin:0;font:700 44px/1.7 var(--f-text);text-align:center;color:var(--p800)}
.ch-top{display:flex;gap:26px}
.stat{font:800 40px var(--f-ui);background:var(--p100);color:var(--p800);border-radius:99px;padding:10px 34px;border:3px solid var(--p200)}
.stat.low{background:var(--badbg);color:var(--bad);border-color:#f2b6b0}
.ch-word{font:700 110px/1.5 var(--f-head);color:var(--p800);background:#fff;border:5px solid var(--p200);border-radius:40px;
  padding:6px 90px;min-width:680px;text-align:center;box-shadow:var(--shadow)}
.ch-word small{display:block;font:700 34px var(--f-ui);color:var(--bad)}
.ch-word.ok{border-color:var(--ok);background:var(--okbg)}
.ch-word.bad{border-color:var(--bad);background:var(--badbg);animation:shake .45s}
.ch-cats{display:flex;gap:24px}
.cat{border:0;font:800 46px/1.5 var(--f-ui);padding:16px 40px;border-radius:30px;transition:transform .15s;color:#fff}
.cat:hover{transform:translateY(-4px)} .cat:active{transform:scale(.94)}
.cat-0{background:var(--p700);box-shadow:0 8px 0 var(--p900)}
.cat-1{background:var(--y500);color:var(--p900);box-shadow:0 8px 0 #a8821c}

    const p = h('div', { class: 'conf' }), w = (8 + Math.random() * 10) * scale;
    p.style.cssText = `width:${w}px;height:${w * (.4 + Math.random() * .9)}px;left:${x}px;top:${y}px;background:${colors[i % colors.length]};border-radius:${Math.random() < .4 ? '50%' : '2px'};box-shadow:0 0 0 1px rgba(0,0,0,.05)`;
    fx.append(p);
    const a = Math.random() * Math.PI * 2, v = (220 + Math.random() * 480) * scale;
    const dx = Math.cos(a) * v, dy = Math.sin(a) * v - 260 * scale, fall = (450 + Math.random() * 450) * scale, r = Math.random() * 720 - 360;
    p.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) rotate(${r}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx * 1.15}px,${dy + fall}px) rotate(${r * 2}deg)`, opacity: 0 }], { duration: 1700 + Math.random() * 900, easing: 'cubic-bezier(.12,.7,.3,1)' }).onfinish = () => p.remove();
  }
}

function Timer(seconds, mini) {
  let total = seconds, left = seconds, id = null;
  const C = 2 * Math.PI * 64;
  const el = h('div', { class: 'timer' + (mini ? ' mini' : '') });
  el.innerHTML = `<div class="t-ring"><svg viewBox="0 0 150 150"><circle class="t-track" cx="75" cy="75" r="64"/>
    <circle class="t-bar" cx="75" cy="75" r="64" stroke-dasharray="${C.toFixed(2)}"/></svg><div class="t-num"></div></div>
    <div class="t-btns"><button type="button" class="icon-btn t-play" title="تشغيل / إيقاف">▶</button>
    <button type="button" class="icon-btn t-reset" title="إعادة المؤقت">↺</button></div>`;
  const num = $('.t-num', el), bar = $('.t-bar', el), play = $('.t-play', el);
  const draw = () => { num.textContent = left > 0 ? fmtTime(left) : '⏰'; bar.style.strokeDashoffset = C * (1 - left / total); el.classList.toggle('low', left > 0 && left <= 10); play.textContent = id ? '⏸' : '▶'; };
  const stop = () => { clearInterval(id); id = null; draw(); };
  const reset = () => { clearInterval(id); id = null; left = total; el.classList.remove('done', 'low'); draw(); };
  const tick = () => { if (!el.isConnected) { clearInterval(id); id = null; return; } left--; if (left <= 0) { left = 0; stop(); el.classList.add('done'); sfx.bell(); } else { if (left <= 5) sfx.tick(); draw(); } };
  const start = () => { if (id) return; if (left <= 0) reset(); el.classList.remove('done'); id = setInterval(tick, 1000); draw(); };
  play.onclick = () => (id ? stop() : start());
  $('.t-reset', el).onclick = reset;
  draw();
  return { el, start, stop, reset };
}

/* ⑦ ⑧ خريطة الرحلة المتحركة */
function routeMap() {
  const W = ROUTE.w, H = ROUTE.h;
  const lands = Object.entries(ROUTE.paths).map(([n, d]) => `<path class="c${n === 'Saudi Arabia' ? ' ksa-r' : ''}" d="${d}"/>`).join('');
  const t = (lon, lat, txt, cls, rot = 0) => { const [x, y] = RP(lon, lat); return `<text class="${cls}" x="${x.toFixed(0)}" y="${y.toFixed(0)}"${rot ? ` transform="rotate(${rot} ${x.toFixed(0)} ${y.toFixed(0)})"` : ''}>${txt}</text>`; };
  const dahna = [[44.6, 29.2], [45.9, 27.6], [46.9, 26.0], [47.5, 24.4], [47.8, 22.6]].map(p => RP(...p));
  const dPath = 'M' + dahna.map(p => p.map(v => v.toFixed(0)).join(' ')).join(' L');
  const [jx, jy] = RP(50.1, 23.6);
  const svg = svgEl(`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <rect class="seaR" width="${W}" height="${H}"/><rect width="${W}" height="${H}" fill="url(#seaWaves)"/>
    <g>${lands}</g>
    <path d="${dPath}" fill="none" stroke="#e8c98a" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    <path d="${dPath}" fill="none" stroke="#d9b06a" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9" opacity=".7"/>
    <ellipse cx="${jx.toFixed(0)}" cy="${jy.toFixed(0)}" rx="80" ry="55" fill="#e8c98a" opacity=".9"/>
    <g class="lbls">
      ${t(46.3, 27.2, 'الدهناء', 'sand', -58)}${t(48.55, 26.2, 'الصمّان', 'sand')}${t(50.1, 23.15, 'الجافورة', 'sand')}${t(48.6, 22.35, 'الربع الخالي', 'sand')}
      ${t(44.2, 29.9, 'العراق', 'ctx')}${t(50.6, 29.4, 'الخليج العربي', 'wt', 32)}${t(51.25, 25.2, 'قطر', 'ctx')}${t(50.95, 26.45, 'البحرين', 'ctx')}
      ${t(44.3, 26.0, 'نجد', 'ctx')}
    </g>
    <g class="rt-paths"></g><g class="rt-pins"></g><g class="rt-camel"></g>
  </svg>`);
  return h('div', { class: 'map rmap rv', style: `--ar:${W}/${H}` }, svg);
}
R.route = s => {
  const map = routeMap(), svg = map.firstChild;
  const gPaths = svg.querySelector('.rt-paths'), gPins = svg.querySelector('.rt-pins'), gCamel = svg.querySelector('.rt-camel');
  const add = (g, html) => { const n = svgEl(`<svg xmlns="http://www.w3.org/2000/svg">${html}</svg>`); const k = n.firstChild; g.append(k); return k; };
  const info = h('div', { class: 'rt-info card' }, h('div', { class: 'nb-empty' }, '🐪 اضغطي «ابدئي الرحلة» لنتتبّعَ خُطى المؤسِّس'));
  let cur = -1;
  const chips = s.steps.map((st, k) => h('button', { type: 'button', class: 'rt-chip', onclick: () => { if (k === cur + 1) step(); else if (k <= cur) show(k); } },
    h('span', { class: 'rt-n' }, ar(k + 1)), st.name));
  const nextBtn = h('button', { type: 'button', class: 'btn yellow', onclick: () => step() }, '🐪 ابدئي الرحلة');
  const show = k => {
    const st = s.steps[k];
    chips.forEach((c, j) => c.classList.toggle('on', j === k));
    info.replaceChildren(
      h('div', { class: 'rt-head pop' }, h('span', { class: 'rt-ico' }, st.icon), h('b', {}, st.name), st.men ? h('span', { class: 'rt-men' }, '👥 ' + st.men) : null),
      rich(st.text, 'div', 'rt-txt pop'));
  };
  const curve = (a, b, bend = .18) => {
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1];
    return `M${a[0].toFixed(0)} ${a[1].toFixed(0)} Q${(mx - dy * bend).toFixed(0)} ${(my + dx * bend).toFixed(0)} ${b[0].toFixed(0)} ${b[1].toFixed(0)}`;
  };
  const pin = (st, k) => { const [x, y] = RP(st.lon, st.lat);
    return `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})"><g class="pin-in pop"><circle class="pr" r="16" style="stroke:${s.color}"/><circle r="12" fill="${s.color}" stroke="#fff" stroke-width="4"/>
      <text y="5" class="rt-num">${ar(k + 1)}</text><text y="${st.ly ?? (st.lat > 29 ? 46 : -26)}" class="rt-lbl">${st.name}</text></g></g>`; };
  function step() {
    if (cur >= s.steps.length - 1) return;
    cur++;
    const st = s.steps[cur], b = RP(st.lon, st.lat);
    if (cur > 0) {
      const p = s.steps[cur - 1], a = RP(p.lon, p.lat);
      const path = add(gPaths, `<path class="rt-path${st.back ? ' back' : ''}" d="${curve(a, b, st.back ? -.22 : .18)}" style="stroke:${s.color}"/>`);
      const L = path.getTotalLength();
      if (!st.back) {                        // رسم المسار تدريجيًا
        path.style.strokeDasharray = L; path.style.strokeDashoffset = L; path.getBoundingClientRect();
        path.style.transition = 'stroke-dashoffset 1.4s ease-in-out';
        requestAnimationFrame(() => { path.style.strokeDashoffset = 0; });
        setTimeout(() => { path.style.strokeDashoffset = 0; }, 60);
      }
      // الجمل يتحرك على المسار
      gCamel.innerHTML = `<text class="rt-camel-i" font-size="46">🐪</text>`;
      const camel = gCamel.firstChild, t0 = performance.now();
      const mv = () => { const t = Math.min(1, (performance.now() - t0) / 1400), pt = path.getPointAtLength(L * t);
        camel.setAttribute('x', pt.x); camel.setAttribute('y', pt.y - 14); if (t < 1 && camel.isConnected) requestAnimationFrame(mv); };
      mv(); setTimeout(() => { camel.setAttribute('x', b[0]); camel.setAttribute('y', b[1] - 14); }, 1500);
    }
    if (st.branch) {
      const c = RP(st.branch.lon, st.branch.lat);
      add(gPaths, `<path class="rt-path branch" d="${curve(b, c, .1)}" style="stroke:${s.color}"/>`);
      add(gPins, `<g transform="translate(${c[0].toFixed(0)} ${c[1].toFixed(0)})"><g class="pin-in pop"><text y="10" style="font-size:40px;stroke:none">⚔️</text><text y="-28" class="rt-lbl">${st.branch.name}</text></g></g>`);
    }
    if (!st.back) add(gPins, pin(st, cur));
    setTimeout(() => { show(cur); sfx.ding(); }, cur > 0 ? 900 : 0);
    nextBtn.textContent = cur >= s.steps.length - 1 ? '🏁 وصلنا!' : '➡️ المحطّة التالية';
    if (cur >= s.steps.length - 1) { nextBtn.disabled = true; setTimeout(() => celebrate(info, 90), 1500); }
  }
  return [head(s), h('div', { class: 'mapwrap rt' }, map,
    h('div', { class: 'panel' }, h('div', { class: 'rt-chips rv' }, chips), info, h('div', { class: 'btn-row rv' }, nextBtn)))];
};

          svgEl(`<svg class="seal" viewBox="-50 -50 100 100"><circle r="46" fill="#d4a62a"/><circle r="38" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 4"/><text y="14" text-anchor="middle" font-size="44" fill="#0f5132" font-family="Tajawal" font-weight="900">${s.seal || '٣٤'}</text></svg>`),
          h('div', {}, h('b', {}, s.source), h('small', {}, '📜 ' + s.num))),
        h('div', { class: 'doc-b' }, h('div', { class: 'doc-num' }, s.num), txt)),
      h('div', { class: 'art-side' },
        h('button', { type: 'button', class: 'p-box q card rv', style: 'text-align:start;cursor:pointer;font-family:var(--f-text)', onclick: () => { ans.classList.add('show'); sfx.success(); } }, s.q),
        ans,
        h('button', { type: 'button', class: 'btn yellow rv', onclick: e => { if (k < s.ideas.length) { ideas.append(h('div', { class: 'idea' }, s.ideas[k++])); sfx.ding(); }
          if (k >= s.ideas.length) { e.currentTarget.disabled = true; e.currentTarget.style.opacity = .6; } } }, s.ideasTitle),
        ideas))];
};

/* ⑮ تحدي الدقيقة */
R.challenge = s => {
  const box = h('div', { class: 'ch card rv' });
  let id = null;
  const intro = () => box.replaceChildren(h('div', { class: 'ch-ico' }, '🏆'), rich(s.description, 'p', 'ch-desc'),
    h('button', { type: 'button', class: 'btn big', onclick: start }, '🚀 ابدئي التحدّي'));
  function start() {
    clearInterval(id);
    const words = shuffle([...s.words]);
    let idx = 0, score = 0, left = s.seconds, locked = false;
    const sc = h('span', { class: 'stat' }), tm = h('span', { class: 'stat' }), pr = h('span', { class: 'stat' });
    const word = h('div', { class: 'ch-word' });
    const draw = () => { sc.textContent = '⭐ ' + ar(score); tm.textContent = '⏱ ' + fmtTime(left); pr.textContent = '📝 ' + ar(Math.min(idx + 1, words.length)) + ' / ' + ar(words.length); tm.classList.toggle('low', left <= 10); };
    const show = () => { word.className = 'ch-word'; word.textContent = words[idx].w; void word.offsetWidth; word.classList.add('pop'); draw(); };
    const finish = () => {
      clearInterval(id); id = null;
      const ratio = score / words.length;
      box.replaceChildren(h('div', { class: 'ch-ico' }, ratio >= .8 ? '🏅' : ratio >= .5 ? '🎉' : '💪'),
        h('div', { class: 'ch-result', html: `نتيجتُكُنّ: <b>${ar(score)}</b> من ${ar(words.length)}` }),
        h('p', { class: 'ch-desc' }, ratio >= .8 ? 'مُذهل! استحققتُنَّ وسامَ المستكشفةِ السعوديّة 🏅' : ratio >= .5 ? 'رائع! أداءٌ جميل 💚' : 'محاولةٌ جميلة.. هيّا نحاولُ مرّةً أخرى 💪'),
        h('button', { type: 'button', class: 'btn', onclick: start }, '🔁 إعادة التحدّي'));
      if (ratio >= .5) celebrate(box, 120); else sfx.pop();
    };
    const answer = (k, btn) => {
      if (locked) return; locked = true;
      const ok = words[idx].c === k;
      if (ok) { score++; sfx.ding(); const [x, y] = center(btn); confetti(x, y, 25); }
      else { sfx.wrong(); word.append(h('small', {}, '← ' + s.categories[words[idx].c].label)); }
      word.classList.add(ok ? 'ok' : 'bad'); draw();
      setTimeout(() => { idx++; locked = false; if (idx >= words.length) finish(); else show(); }, ok ? 550 : 1300);
    };
    box.replaceChildren(h('div', { class: 'ch-top' }, sc, tm, pr), word,
      h('div', { class: 'ch-cats' }, s.categories.map((c, k) => h('button', { type: 'button', class: 'cat cat-' + k, onclick: e => answer(k, e.currentTarget) }, c.icon + ' ' + c.label))));
    id = setInterval(() => { if (!box.isConnected) { clearInterval(id); return; } left--; if (left <= 0) { left = 0; draw(); sfx.bell(); finish(); } else { if (left <= 5) sfx.tick(); draw(); } }, 1000);
    show();
  }
  intro();
  return [head(s), box];
};

/* ⑯ الاختبار الختامي */
R.quiz = s => {
  const box = h('div', { class: 'quiz' });
  let qi = 0, score = 0;
  const res = [];
  const dots = () => h('div', { class: 'qz-dots' }, s.items.map((_, k) => h('i', { class: res[k] === true ? 'ok' : res[k] === false ? 'no' : k === qi ? 'cur' : '' })));
  const render = () => {
    if (qi >= s.items.length) {
      const r = score / s.items.length;
      box.replaceChildren(h('div', { class: 'qz-end card' },
        h('div', { class: 'ch-ico' }, r >= .85 ? '🏆' : r >= .5 ? '🌟' : '💪'),
        h('div', { class: 'ch-result', html: `نتيجتُكِ: <b>${ar(score)}</b> من ${ar(s.items.length)}` }),
        dots(),
        h('p', { class: 'ch-desc' }, r >= .85 ? 'ممتاز! أتقنتِ درسَ الموقعِ والحدود 💚' : r >= .5 ? 'جيّدٌ جدًّا! راجعي ما أخطأتِ فيه 📖' : 'لا بأس.. نراجعُ الدرسَ معًا مرّةً أخرى 💪'),
        h('button', { type: 'button', class: 'btn', onclick: () => { qi = 0; score = 0; res.length = 0; render(); } }, '🔁 إعادة الاختبار')));
      if (r >= .5) celebrate(box, 130);
      return;
    }
    const it = s.items[qi];
    let answered = false;
    const next = h('div', { class: 'qz-next' });
    const opts = it.o.map((o, k) => h('button', { type: 'button', class: 'opt', onclick: e => {
      if (answered) return; answered = true;
      const ok = k === it.c; res[qi] = ok; if (ok) score++;
      e.currentTarget.classList.add(ok ? 'correct' : 'wrong');
      if (ok) celebrate(e.currentTarget, 40); else { sfx.wrong(); shakeEl(e.currentTarget); opts[it.c].classList.add('correct'); }
      $('.qz-dots', box).replaceWith(dots());
      next.replaceChildren(h('button', { type: 'button', class: 'btn yellow pop', onclick: () => { qi++; render(); } }, qi < s.items.length - 1 ? 'السؤالُ التالي ←' : '🏁 النتيجة'));
    } }, h('span', { class: 'o-k' }, KEYS[k]), o));
    box.replaceChildren(
      h('div', { class: 'qz-top' }, h('span', { class: 'stat' }, `سؤال ${ar(qi + 1)} من ${ar(s.items.length)}`), dots(), h('span', { class: 'stat' }, '⭐ ' + ar(score))),
      rich(it.q, 'div', 'qz-q card pop'), h('div', { class: 'opts' }, opts), next);
  };
  render();
  return [head(s), box];
};

/* ⑰ تقييم ذاتي + واجب */
R.exit = s => [head(s),
  h('div', { class: 'exit' },
    h('div', { class: 'self card rv' }, rich(s.question, 'p', 'self-q'),
      h('div', { class: 'emos' }, s.options.map(o => { let n = 0; const c = h('span', { class: 'c' }, ar(0));
        return h('button', { type: 'button', class: 'emo', onclick: () => { c.textContent = ar(++n); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); sfx.pop(); } },
          h('span', { class: 'e' }, o.e), h('span', { class: 'l' }, o.l), c); }))),
    h('div', { class: 'hw card rv' }, rich(s.homeworkTitle, 'h3'),
      h('ol', {}, s.homework.map((t, k) => h('li', {}, h('span', { class: 'n' }, ar(k + 1)), rich(t, 'span')))))),
];

/* =====================================================================
   بناء الشرائح والتنقل
   ===================================================================== */
const slidesBox = $('#slides');
const slideEls = SLIDES.map((s, i) => { const el = h('section', { class: 'slide s-' + s.type, 'data-i': i }); slidesBox.append(el); return el; });
let cur = 0;

function buildSlide(i) {
  HOOKS[i]?.leave?.(); delete HOOKS[i];
  const s = SLIDES[i], el = slideEls[i], render = R[s.type];
  el.replaceChildren(...[].concat(render ? render(s, i) : h('p', {}, 'نوع شريحة غير معروف: ' + s.type)).flat().filter(Boolean));
  el.querySelectorAll('.rv').forEach((e, k) => e.style.setProperty('--i', k));
  if (el.classList.contains('active')) { el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); HOOKS[i]?.enter?.(); }
}

function show(i, dir = 1) {
  const to = slideEls[i], from = slideEls[cur];
  if (from !== to) { HOOKS[cur]?.leave?.(); from.classList.remove('active'); from.classList.add('leaving'); setTimeout(() => from.classList.remove('leaving'), 400); }
  to.classList.remove('leaving', 'a-fade', 'a-slide', 'a-zoom', 'd-next', 'd-prev', 'active');
  void to.offsetWidth;
  to.classList.add('active', 'a-' + (SLIDES[i].anim || 'fade'), dir > 0 ? 'd-next' : 'd-prev');
  cur = i;
  HOOKS[i]?.enter?.();
  const N = SLIDES.length, pct = ((i + 1) / N * 100);
  $('#counter').textContent = `${ar(i + 1)} / ${ar(N)}`;
  $('#cNum').textContent = $('#cNum').dataset.n = `${ar(i + 1)} / ${ar(N)}`;
  $('#progress i').style.width = pct + '%';
  $('#progress b').style.right = pct + '%';
  history.replaceState(null, '', '#' + (i + 1));
}
const go = i => { if (i >= 0 && i < SLIDES.length && i !== cur) show(i, i > cur ? 1 : -1); };
const next = () => go(cur + 1);
const prev = () => go(cur - 1);


/* =====================================================================
   لوحة المفاتيح والفأرة واللمس
   ===================================================================== */
window.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) { if (e.key === 'Escape') t.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  sfx.unlock();
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (!e.repeat) prev(); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(SLIDES.length - 1); }
  else if (e.key === 'ت' || e.code === 'KeyF') { e.preventDefault(); if (!e.repeat) clap(); }
}, { capture: true });

document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); sfx.unlock(); });

$('#cPrev').onclick = prev;
$('#cNext').onclick = next;
$('#cClap').onclick = clap;
$('#cFull').onclick = () => {
  const d = document, el = d.documentElement;
  if (!(d.fullscreenElement || d.webkitFullscreenElement)) {
    const lock = () => screen.orientation?.lock?.('landscape').catch(() => {});
    if (el.requestFullscreen) el.requestFullscreen().then(lock).catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else toast('الآيفون لا يدعم ملء الشاشة من المتصفح 📱 — زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية»');
  } else (d.exitFullscreen || d.webkitExitFullscreen)?.call(d);
};

let tx = null, ty = null;
addEventListener('touchstart', e => { if (e.touches.length === 1 && !e.target.closest('.rb-wrap')) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = null; }, { passive: true });
addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 110 && Math.abs(dy) < 70) (dx < 0 ? next() : prev());
}, { passive: true });
addEventListener('wheel', e => e.preventDefault(), { passive: false });
addEventListener('touchmove', e => e.preventDefault(), { passive: false });

let idleT;
const wake = () => {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => { if ($('#controls').matches(':hover')) wake(); else document.body.classList.add('idle'); }, 2800);
};
['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));


/* =====================================================================
   تحجيم المسرح + الإطار الرملي المموّج
   ===================================================================== */
const stage = $('#stage');
function fit() {
  const cs = getComputedStyle(document.documentElement), px = v => parseFloat(cs.getPropertyValue(v)) || 0;
  const t = px('--sat'), r = px('--sar'), b = px('--sab'), l = px('--sal');
  const vv = window.visualViewport, VW = vv ? vv.width : innerWidth, VH = vv ? vv.height : innerHeight;
  const W = VW - l - r, H = VH - t - b;
  scale = Math.min(W / 1920, H / 1080);
  stage.style.left = (l + W / 2) + 'px'; stage.style.top = (t + H / 2) + 'px';
  stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
  const phone = matchMedia('(pointer:coarse)').matches && Math.min(VW, VH) < 600;
  const free = (W - 1920 * scale) / 2;
  const side = phone && free >= 46, ctr = $('#controls');
  document.body.classList.toggle('phone', phone);
  document.body.classList.toggle('side', side);
  if (side) {
    if (ctr.parentNode !== document.body) document.body.appendChild(ctr);
    ctr.style.left = (l + free / 2) + 'px'; ctr.style.setProperty('--cw', Math.min(52, Math.floor(free - 18)) + 'px');
    $('#cNum').dataset.n = $('#cNum').textContent;
  } else {
    if (ctr.parentNode !== stage) stage.appendChild(ctr);
    ctr.style.left = ''; ctr.style.removeProperty('--cw');
  }
}
addEventListener('resize', fit);
window.visualViewport?.addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 350));

let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 6500); }

function wavyRect(x0, y0, x1, y1, amp, wl) {
  const pts = [];
  const edge = (xa, ya, xb, yb, nx, ny) => {
    const len = Math.hypot(xb - xa, yb - ya), n = Math.round(len / 6), waves = Math.round(len / wl);
    for (let i = 0; i < n; i++) { const t = i / n, off = amp * (1 - Math.cos(t * waves * 2 * Math.PI)) / 2; pts.push([(xa + (xb - xa) * t + nx * off).toFixed(1), (ya + (yb - ya) * t + ny * off).toFixed(1)]); }
  };
  edge(x0, y0, x1, y0, 0, 1); edge(x1, y0, x1, y1, -1, 0); edge(x1, y1, x0, y1, 0, -1); edge(x0, y1, x0, y0, 1, 0);
  return 'M' + pts.map(p => p.join(' ')).join('L') + 'Z';
}
$('#wavePath').setAttribute('d', wavyRect(26, 24, 1894, 1056, 18, 220));


/* =====================================================================
   التشغيل
   ===================================================================== */
fit();
SLIDES.forEach((_, i) => buildSlide(i));
const startAt = Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), SLIDES.length - 1);
cur = startAt;
show(startAt, 1);
wake();
</script>
</body>
</html>
